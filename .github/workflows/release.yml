name: Release

# Publishes to npm when a GitHub Release is published. release-please.yml
# opens a "release please" pull request that bumps package.json and
# CHANGELOG.md from Conventional Commits merged to main; merging that PR is
# what creates the GitHub Release (and tag) that triggers this workflow.
# This workflow re-runs the full quality gate before publishing so a release
# can never skip lint/typecheck/test/build.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    name: Build, verify, and publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run typecheck:test
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run size

      - name: Verify package.json version matches the release tag
        run: |
          # release-please's manifest mode tags releases as "svgin-react-vX.Y.Z"
          # (component-prefixed), not just "vX.Y.Z" - strip everything up to
          # and including the *last* "v" rather than assuming a leading one,
          # so this works with either format.
          TAG="${GITHUB_REF_NAME##*v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Publish to npm
        # Trusted publishing (OIDC) needs npm CLI >= 11.5.1, newer than what
        # ships with Node 22, and pnpm's own `publish` command does not speak
        # OIDC yet (https://github.com/pnpm/pnpm/issues/9812), so the actual
        # publish step uses `npm publish` directly instead of `pnpm publish`.
        # No NPM_TOKEN is needed: npm CLI auto-detects the GitHub Actions
        # OIDC token and exchanges it for a short-lived publish credential,
        # verified against the trusted publisher configured on npmjs.com for
        # this exact repo + workflow file.
        run: |
          npm install -g npm@^11.5.1
          npm publish --access public --provenance
