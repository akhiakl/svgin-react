name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run typecheck:test

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage
      - if: matrix.node-version == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Check bundle size budget
        run: pnpm run size
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 14

  site:
    name: Site (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:site
      - run: pnpm run site:build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Advisory only: a known vuln in a dependency shouldn't silently block
      # every PR, but it should be visible in the run summary.
      - run: pnpm audit --prod || echo "::warning::pnpm audit reported issues - review before releasing"

  pr-report:
    name: PR size & coverage report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          path: head
      - name: Checkout PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: pnpm/action-setup@v6
        with:
          # PR head/base are checked out into head/ and base/ subdirectories
          # (not the workspace root), so pnpm/action-setup has no root
          # package.json to read the "packageManager" field from unless told
          # where to look.
          package_json_file: head/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            head/pnpm-lock.yaml
            base/pnpm-lock.yaml

      - name: Build and test PR head
        working-directory: head
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          node scripts/check-bundle-size.mjs --json --no-fail > ../head-size.json
          pnpm run test:coverage || true
          cp coverage/coverage-summary.json ../head-coverage.json || true

      # The base branch may be missing these scripts, an older lockfile
      # format, or fail its own build - none of that should fail this PR's
      # CI. Every step here is best-effort; pr-report.mjs treats missing
      # data as "n/a" rather than a failure.
      - name: Build and test PR base (best effort)
        working-directory: base
        continue-on-error: true
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build
          node scripts/check-bundle-size.mjs --json --no-fail > ../base-size.json
          pnpm run test:coverage || true
          cp coverage/coverage-summary.json ../base-coverage.json || true

      - name: Build report
        run: node head/scripts/pr-report.mjs head-size.json base-size.json head-coverage.json base-coverage.json > report.md

      - name: Post or update PR comment
        # On a PR from a fork, GITHUB_TOKEN is read-only and this step would
        # just fail; skip posting rather than failing the whole workflow.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = '<!-- svgin-react-pr-report -->';
            const fullBody = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
